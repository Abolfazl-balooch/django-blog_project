{% load static %}
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}"><h2>Stand Blog<em>.</em></h2></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item {% if request.resolver_match.url_name == 'home' %}active {% endif %}">
                    <a class="nav-link" href="{% url 'home' %}">Home
                        <span class="sr-only">(current)</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">About Us</a>
                </li>
                <li class="nav-item {% if request.resolver_match.url_name == 'post_entries' or request.resolver_match.url_name == 'categories' or request.resolver_match.url_name == 'search' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'post_entries' %}">Blog Entries</a>
                </li>
                <li class="nav-item {% if request.resolver_match.url_name == 'contact_us' %}active {% endif %}">
                    <a class="nav-link" href="{% url 'contact_us' %}">Contact Us</a>
                </li>

                {% if user.is_authenticated %}
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="profileDropdown" role="button"
                           data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            {{ user.username }}
                        </a>
                        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="profileDropdown">
                            <a class="btn btn-primary-custom btn-sm px-3" href="{% url 'create_article' %}">NEW ARTICLE</a>
                            <a class="dropdown-item" href="{% url 'show_profile' user.username %}">Profile</a>
                            <a class="dropdown-item" href="{% url 'edit_profile' %}">Settings</a>
                            <div class="dropdown-divider"></div>
                            <form method="post" action="{% url 'logout' %}">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item">Logout</button>
                            </form>
                        </div>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">Login</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
